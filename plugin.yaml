name: herd
version: 0.1.0
description: Channels and DMs shared between up to five Hermes gateways, for humans and agents.
author: Tyler Amberry
license: MIT
homepage: https://github.com/tyleramberry/herd
requires_hermes: ">=0.22.0"
manifest_version: 2
api_version: 1
tags: [multiplayer, chat, peers, desktop]
provides_tools:
  - herd_list_channels
  - herd_post
  - herd_read_channel
  - herd_set_status
config_schema:
  display_name:
    type: str
    default: ""
    label: Your name
    description: How you appear to your teammate in Herd. Defaults to this computer's name.
  peer_name:
    type: str
    default: ""
    label: Teammate's name
    description: A label for the other Hermes, e.g. brooklyn.
  peer_url:
    type: str
    default: ""
    label: Teammate's gateway URL
    description: "Their Hermes API server address, e.g. https://brooklyn-mac.tailnet-name.ts.net:8642 — prefer https:// (or your VPN/tailnet address). A plain http:// URL is accepted only for this machine (127.0.0.1, localhost, ::1)."
  herd_secret:
    type: secret
    env: HERD_SECRET
    label: This gateway's Herd secret
    description: A long random value this gateway requires from peers. Give it to your teammate — they store it as their peer key. It grants Herd access only, never your gateway's API key.
  peer_key:
    type: secret
    env: HERD_PEER_KEY
    label: Teammate's Herd secret
    description: Your teammate's Herd secret (the value they set as their HERD_SECRET — not their gateway API key). Stored in Hermes's secret store, never in config.yaml.
  peer_name_2:
    type: str
    default: ""
    label: Teammate 2's name
    description: Optional. A second teammate (up to four in total, so five gateways). Give each teammate a different name.
  peer_url_2:
    type: str
    default: ""
    label: Teammate 2's gateway URL
    description: Their Hermes API server address, as for teammate 1. Leave blank to not link them.
  peer_key_2:
    type: secret
    env: HERD_PEER_KEY_2
    label: Teammate 2's Herd secret
    description: Teammate 2's Herd secret. Stored in Hermes's secret store, read only for teammate 2.
  peer_name_3:
    type: str
    default: ""
    label: Teammate 3's name
    description: Optional. Give each teammate a different name.
  peer_url_3:
    type: str
    default: ""
    label: Teammate 3's gateway URL
    description: Their Hermes API server address, as for teammate 1. Leave blank to not link them.
  peer_key_3:
    type: secret
    env: HERD_PEER_KEY_3
    label: Teammate 3's Herd secret
    description: Teammate 3's Herd secret. Stored in Hermes's secret store, read only for teammate 3.
  peer_name_4:
    type: str
    default: ""
    label: Teammate 4's name
    description: Optional. Give each teammate a different name.
  peer_url_4:
    type: str
    default: ""
    label: Teammate 4's gateway URL
    description: Their Hermes API server address, as for teammate 1. Leave blank to not link them.
  peer_key_4:
    type: secret
    env: HERD_PEER_KEY_4
    label: Teammate 4's Herd secret
    description: Teammate 4's Herd secret. Stored in Hermes's secret store, read only for teammate 4.
  allow_cleartext_peer:
    type: bool
    default: false
    env: HERD_ALLOW_CLEARTEXT
    label: Send the peer key in cleartext (unsafe)
    description: "A plain http:// URL sends your peer secret in the clear to anyone on the network path, who could also forge sync replies. Prefer https, a VPN/tailnet, or a TLS proxy. Only turn this on if you accept that risk."
  mention_wake:
    type: bool
    default: false
    label: Let my agent answer @mentions
    description: When a teammate's message mentions @your-name or @your-name-hermes, hand it to the chat you picked with /herd-listen. Also needs allow_gateway_injection (see README). Off by default.
